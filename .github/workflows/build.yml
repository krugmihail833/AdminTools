name: build
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/grandmobile/admintools app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AdminTools"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.grandmobile.admintools"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.grandmobile.admintools"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Намеренно без разрешения INTERNET: приложение ничего не отправляет наружу -->
              <application android:label="Админ-тулс" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AdminKeyboard"
                      android:label="Админ-клавиатура"
                      android:exported="true"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          cat > app/src/main/java/com/grandmobile/admintools/Data.kt <<'EOF'
          package com.grandmobile.admintools

          import android.content.Context

          class Act(val cmd: String, val a: Int = 0, val b: Int = 0) {
              fun times(): List<Int> = when {
                  a == 0 -> listOf(0)
                  a == b -> listOf(a)
                  else -> listOf(a, b)
              }
          }

          class Vio(val code: String, val note: String, val variants: List<List<Act>>)

          // строка: код|пояснение|вариант / вариант ; в варианте действия через «+» ; срок: N или A-B
          private val TABLE = """
          2.1 ОП|оск. игрока|mute 15-30
          2.1 ОП|упом. род|mute 90-180
          2.1 ОП|оск. род|ban 3-10
          3.1 ОП|оффтоп в реп|rmute 30
          3.2 ОП|оск. адм|mute 30-60 / ban 3-31
          2.5 ОП|шум в микро|mute 20
          2.5 ОП|музыка в микро|mute 30-60
          5.2 ОП|багаюз|warn
          5.2 ОП|софт|ban 31
          5.3 ОП|уход от рп|jail 120
          1.1 GZ|урон в зз|jail 60+warn
          1.2 GZ|веревка в зз|warn
          DM||jail 30-60
          DB||jail 30
          MG||mute 15
          RK||jail 30
          SK||jail 60-120
          PG||jail 30
          Mass DM||warn
          Mass DM в GZ||jail 90+warn
          """.trimIndent()

          object Data {
              val V: List<Vio> = TABLE.lines().map { l ->
                  val p = l.split("|")
                  Vio(p[0], p[1], p[2].split("/").map { v ->
                      v.split("+").map { a ->
                          val t = a.trim().split(" ")
                          val r = t.getOrNull(1)?.split("-")
                          val x = r?.get(0)?.toInt() ?: 0
                          Act(t[0], x, r?.getOrNull(1)?.toInt() ?: x)
                      }
                  })
              }
          }

          val DEF_T = linkedMapOf(
              "ans" to "/pm {id} {r}",
              "jail" to "/jail {id} {t} {r}",
              "ban" to "/ban {id} {t} {r}",
              "mute" to "/mute {id} {t} {r}",
              "rmute" to "/rmute {id} {t} {r}",
              "warn" to "/warn {id} {r}"
          )

          val DEF_ANS = """
          re|Приветствую, приятной игры на Grand Mobile 10 <3
          re|Приветствую, слежу за Вами.
          re|Приветствую, не владеем данной информацией.
          re|Приветствую, при следующем оффтопе последует мут репорта.
          re|Приветствую, при наличии доказательств подайте жалобу.
          re|Приветствую, не чиним, воспользуйтесь рем.комплектом/эвакуатором.
          re|Приветствую, уточните ваш вопрос или жалобу.
          re|Приветствую, слежу за игроком.
          re|Приветствую, не вмешиваемся в РП процесс.
          re|Приветствую, не чиним / не заправляем / не выдаем / не телепортируем.
          re|Приветствую, если не согласны с наказанием, напишите жалобу.
          re|Приветствую, рп термин.
          re|Приветствую, нашли баг? обратитесь в тех.поддержку.
          re|Приветствую, ожидайте.
          re|Приветствую, не предоставляем данную услугу.
          re|Приветствую, можете узнать самостоятельно.
          re|Приветствую, помогли Вам. Приятной игры!<3
          re|Приветствую, слежу за игроком!
          ev|Приветствую, можете помочь себе сами — кнопка эвакуатора на спидометре.
          ev|Приветствую, можете воспользоваться эвакуатором — кнопка на спидометре.
          ev|Приветствую, нажмите кнопку эвакуатора на спидометре для помощи.
          ev|Приветствую, чтобы перевернуть автомобиль, нажмите кнопку эвакуатора на спидометре.
          ev|Приветствую, чтобы починить автомобиль, нажмите кнопку эвакуатора на спидометре.
          ev|Приветствую, чтобы выбраться из воды, нажмите кнопку эвакуатора на спидометре.
          ev|Здравствуйте, Вы можете помочь себе самостоятельно, нажав кнопку эвакуатора на спидометре.
          rev|Приветствую, игрок был наказан, приятной игры!
          rev|Приветствую, за спам и флуд в чате наказания не выдаем!
          rev|Приветствую, администрация не является гарантом обмена.
          rev|Приветствую, телепорт на мероприятие закрыт.
          rev|Приветствую, игрок не нарушает.
          rev|Приветствую, за время наблюдения нарушений не зафиксировано.
          """.trimIndent()

          val DEF_CMDS = """
          /az
          /gm
          /clist
          /sp {id}
          /spoff
          /spawn {id}
          /slap {id}
          /goto {id}
          /mark
          /gotomark
          /unban {id}
          /unjail {id}
          /unmute {id}
          /freeze {id}
          /unfreeze {id}
          /uncuff {id}
          /gotocar {id}
          /gethere {id}
          /hpall
          /weapall
          """.trimIndent()

          class Store(c: Context) {
              private val p = c.getSharedPreferences("s", Context.MODE_PRIVATE)
              fun templates(): Map<String, String> = DEF_T.mapValues { p.getString("t_" + it.key, it.value) ?: it.value }
              fun answersText(): String = p.getString("ans", DEF_ANS) ?: DEF_ANS
              fun cmdsText(): String = p.getString("cmds", DEF_CMDS) ?: DEF_CMDS
              private fun parse(s: String): List<Pair<String, String>> = s.lines().mapNotNull { l ->
                  val i = l.indexOf('|')
                  if (i < 1 || i == l.length - 1) null else l.substring(0, i).trim() to l.substring(i + 1).trim()
              }
              fun answers(): List<Pair<String, String>> = parse(answersText())
              // строка команды: «/sp {id}» или «название|/sp {id}»; без названия на кнопке будет сама команда
              fun cmds(): List<Pair<String, String>> = cmdsText().lines().map { it.trim() }.filter { it.isNotEmpty() }.map { l ->
                  val i = l.indexOf('|')
                  if (i in 1 until l.length - 1) l.substring(0, i).trim() to l.substring(i + 1).trim()
                  else l.split(" ")[0] to l
              }
              fun count(): Int = p.getInt("cnt", 0)
              fun setCount(n: Int) { p.edit().putInt("cnt", n).apply() }
              fun save(t: Map<String, String>, a: String, c: String) {
                  val e = p.edit()
                  t.forEach { (k, v) -> e.putString("t_$k", v) }
                  e.putString("ans", a).putString("cmds", c).apply()
              }
              fun reset() { val n = p.getInt("cnt", 0); p.edit().clear().putInt("cnt", n).apply() }
          }
          EOF
          cat > app/src/main/java/com/grandmobile/admintools/AdminKeyboard.kt <<'EOF'
          package com.grandmobile.admintools

          import android.content.res.ColorStateList
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          // тёплая палитра: эспрессо, крем, янтарь и терракота
          private val BG = 0xFF1C1512.toInt()
          private val SURF = 0xFF2E2420.toInt()
          private val FIELD = 0xFF241B17.toInt()
          private val LINE = 0xFF43352D.toInt()
          private val ACC = 0xFFF2A33A.toInt()
          private val SEND = 0xFFE8743B.toInt()
          private val TXT = 0xFFF6E9DA.toInt()
          private val DARK = 0xFF2A1A10.toInt()
          private val HINT = 0xFF8C7767.toInt()
          private val DANGER = 0xFF6E2B25.toInt()
          private val TINT = mapOf(
              "jail" to 0xFF5E4313.toInt(), "ban" to 0xFF6E2B25.toInt(),
              "mute" to 0xFF35503F.toInt(), "rmute" to 0xFF35503F.toInt(), "warn" to 0xFF5A3558.toInt()
          )

          class AdminKeyboard : InputMethodService() {
              private val st by lazy { Store(this) }
              private lateinit var list: LinearLayout
              private lateinit var idTv: TextView
              private val tabs = ArrayList<Button>()
              private var compact = false
              private var tab = 0
              private var open = -1
              private var grp = ""
              private val id = StringBuilder()
              private var tpl: Map<String, String> = DEF_T
              private var ans: List<Pair<String, String>> = emptyList()
              private var cmds: List<Pair<String, String>> = emptyList()
              private var count = 0
              private var pendingAnswer = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private val unit get() = if (compact) 35 else 42

              override fun onEvaluateFullscreenMode(): Boolean = false

              private fun bg(col: Int): RippleDrawable {
                  val g = when (col) {
                      ACC -> GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFFF5B342.toInt(), 0xFFEE8F3A.toInt()))
                      SEND -> GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFFEE7A45.toInt(), 0xFFD9553A.toInt()))
                      else -> GradientDrawable().apply { setColor(col); setStroke(dp(1), LINE) }
                  }
                  g.cornerRadius = dp(9).toFloat()
                  return RippleDrawable(ColorStateList.valueOf(0x33FFFFFF), g, null)
              }

              private fun btn(
                  t: String, col: Int = SURF, w: Float = 1f, size: Float = 15f, h: Int = 0,
                  left: Boolean = false, click: () -> Unit
              ): Button = Button(this).apply {
                  text = t; isAllCaps = false; textSize = size
                  setTextColor(if (col == ACC || col == SEND) DARK else TXT); background = bg(col)
                  stateListAnimator = null
                  minHeight = 0; minimumHeight = 0; minWidth = 0; minimumWidth = 0
                  setPadding(dp(6), 0, dp(6), 0)
                  gravity = if (left) Gravity.START or Gravity.CENTER_VERTICAL else Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(0, dp(if (h == 0) unit else h), w)
                      .apply { setMargins(dp(2), dp(1), dp(2), dp(1)) }
                  setOnClickListener { click() }
              }

              private fun hrow(vararg v: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  v.forEach { addView(it) }
              }

              // наказания и ответы: если ID не введён, подставляется слово ID
              private fun fmt(cmd: String, t: Int, r: String): String =
                  (tpl[cmd] ?: DEF_T.getValue(cmd))
                      .replace("{id}", if (id.isEmpty()) "ID" else id.toString())
                      .replace("{t}", if (t == 0) "" else t.toString())
                      .replace("{r}", r)
                      .replace(Regex("\\s+"), " ").trim()

              // команды: без ID вставляется «/sp » с пробелом, чтобы номер можно было дописать
              private fun fmtCmd(t: String): String {
                  var s = t.replace("{id}", id.toString()).replace("{t}", "").replace("{r}", "")
                      .replace(Regex("\\s+"), " ").trim()
                  if (t.contains("{id}") && id.isEmpty()) s += " "
                  return s
              }

              private fun commit(s: String) { pendingAnswer = false; currentInputConnection?.commitText(s, 1) }

              // одно нажатие = одна отправка; ответ игроку после отправки прибавляет 1 к счётчику
              private fun sendEnter() {
                  val ic = currentInputConnection ?: return
                  // false: выполнить действие поля, даже если оно помечено «Enter = новая строка»
                  if (!sendDefaultEditorAction(false)) {
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
                  if (pendingAnswer) {
                      count += 1
                      st.setCount(count)
                      pendingAnswer = false
                      updateTabs()
                  }
              }

              // стирает всё, что написано в поле ввода (не только вставленное клавиатурой)
              private fun clearAll() {
                  val ic = currentInputConnection ?: return
                  pendingAnswer = false
                  ic.beginBatchEdit()
                  ic.performContextMenuAction(android.R.id.selectAll)
                  ic.commitText("", 1)
                  ic.deleteSurroundingText(10000, 10000)
                  ic.endBatchEdit()
              }

              private fun reload() { tpl = st.templates(); ans = st.answers(); cmds = st.cmds(); count = st.count() }

              private fun updateTabs() {
                  if (tabs.size > 1) tabs[1].text = "Ответы  " + count
              }

              override fun onCreateInputView(): View {
                  reload()
                  compact = resources.configuration.screenHeightDp < 480
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                  }
                  tabs.clear()
                  listOf("Наказания", "Ответы", "Команды").forEachIndexed { i, n ->
                      tabs.add(btn(n, size = 14f) { setTab(i) })
                  }
                  // долгое нажатие на «Ответы» обнуляет счётчик
                  tabs[1].setOnLongClickListener {
                      count = 0; st.setCount(0); updateTabs()
                      Toast.makeText(this, "Счётчик сброшен", Toast.LENGTH_SHORT).show()
                      true
                  }
                  updateTabs()
                  val abc = btn("ABC", w = 0.6f, size = 14f) {
                      val ok = if (Build.VERSION.SDK_INT >= 28) switchToPreviousInputMethod() else false
                      if (!ok) (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                  }
                  val send = btn("Отправить", SEND, w = 1.3f, size = 14f) { sendEnter() }
                  val erase = btn("Стереть", DANGER, w = 1.1f, size = 14f) { clearAll() }
                  idTv = TextView(this).apply {
                      setTextColor(TXT); textSize = if (compact) 17f else 19f; typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), 0, dp(12), 0)
                      background = GradientDrawable().apply { setColor(FIELD); setStroke(dp(1), LINE); cornerRadius = dp(9).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(0, dp(unit), if (compact) 1.4f else 1.6f)
                          .apply { setMargins(dp(2), dp(1), dp(2), dp(1)) }
                  }
                  val back = btn("⌫", w = 0.6f) { if (id.isNotEmpty()) id.deleteCharAt(id.length - 1); idChanged() }
                  val clear = btn("C", w = 0.6f) { id.setLength(0); idChanged() }

                  if (compact) {
                      root.addView(hrow(*tabs.toTypedArray(), idTv, back, clear, abc, erase, send))
                  } else {
                      root.addView(hrow(*tabs.toTypedArray(), abc))
                      root.addView(hrow(idTv, back, clear, erase, send))
                  }
                  root.addView(hrow(*"1234567890".map { c ->
                      btn(c.toString(), h = unit - 2) { if (id.length < 7) id.append(c); idChanged() }
                  }.toTypedArray()))

                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val sv = ScrollView(this).apply { addView(list) }
                  root.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(if (compact) 104 else 150)))

                  idChanged()
                  setTab(tab)
                  return root
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  if (::list.isInitialized) { reload(); updateTabs(); renderList() }
              }

              private fun idChanged() {
                  idTv.text = if (id.isEmpty()) "ID" else id.toString()
                  idTv.setTextColor(if (id.isEmpty()) HINT else TXT)
                  if (::list.isInitialized) renderList()
              }

              private fun setTab(t: Int) {
                  tab = t; open = -1
                  tabs.forEachIndexed { i, b ->
                      b.background = bg(if (i == t) ACC else SURF)
                      b.setTextColor(if (i == t) DARK else TXT)
                  }
                  renderList()
              }

              private fun renderList() {
                  list.removeAllViews()
                  when (tab) {
                      0 -> violations()
                      1 -> answers()
                      else -> commands()
                  }
              }

              private fun violations() {
                  Data.V.forEachIndexed { i, v ->
                      val label = v.code + (if (v.note.isBlank()) "" else "  ·  " + v.note)
                      list.addView(hrow(btn(label, if (open == i) ACC else SURF, left = true) {
                          open = if (open == i) -1 else i
                          renderList()
                      }))
                      if (open == i) {
                          v.variants.forEach { acts ->
                              acts.forEach { a ->
                                  a.times().forEach { t ->
                                      val c = fmt(a.cmd, t, v.code)
                                      list.addView(hrow(btn(c, TINT[a.cmd] ?: SURF, size = 16f, left = true) { commit(c) }))
                                  }
                              }
                          }
                      }
                  }
              }

              private fun answers() {
                  val groups = listOf("") + ans.map { it.first }.distinct()
                  list.addView(hrow(*groups.map { g ->
                      btn(if (g.isEmpty()) "Все" else g, if (grp == g) ACC else SURF, size = 14f) { grp = g; renderList() }
                  }.toTypedArray()))
                  ans.filter { grp.isEmpty() || it.first == grp }.forEach { (_, text) ->
                      list.addView(hrow(btn(text, SURF, size = 14f, h = if (compact) 50 else 60, left = true) {
                          commit(fmt("ans", 0, text))
                          pendingAnswer = true
                      }))
                  }
              }

              private fun commands() {
                  val cols = if (compact) 8 else 4
                  cmds.chunked(cols).forEach { row ->
                      val v = ArrayList<View>()
                      row.forEach { (name, c) -> v.add(btn(name, size = 14f) { commit(fmtCmd(c)) }) }
                      repeat(cols - row.size) {
                          v.add(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, dp(unit), 1f) })
                      }
                      list.addView(hrow(*v.toTypedArray()))
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/grandmobile/admintools/MainActivity.kt <<'EOF'
          package com.grandmobile.admintools

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val st = Store(this)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun tv(t: String) = TextView(this).apply { text = t; textSize = 15f; setPadding(0, pad / 2, 0, pad / 4) }
                  fun bt(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }

                  root.addView(tv("1. Включите «Админ-клавиатура» в списке клавиатур, затем выберите её. Приложение работает без интернета."))
                  root.addView(bt("Открыть настройки клавиатур") { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) })
                  root.addView(bt("Выбрать клавиатуру") {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                  })
                  root.addView(tv("2. Быстрые ответы, по одному на строку: группа|текст"))
                  val ans = EditText(this).apply { setText(st.answersText()); minLines = 8; gravity = Gravity.TOP }
                  root.addView(ans)
                  root.addView(tv("3. Команды, по одной на строку: /команда {id} (или название|/команда). Если ID не введён, команда вставится без номера."))
                  val cmds = EditText(this).apply { setText(st.cmdsText()); minLines = 5; gravity = Gravity.TOP }
                  root.addView(cmds)
                  root.addView(tv("4. Шаблоны команд ({id} ID, {t} срок, {r} причина или текст ответа)"))
                  val tpl = st.templates()
                  val fields = DEF_T.keys.associateWith { k ->
                      EditText(this).apply { setText(tpl.getValue(k)); setSingleLine() }
                  }
                  fields.forEach { (k, e) -> root.addView(tv(k)); root.addView(e) }
                  root.addView(bt("Сохранить") {
                      val t = fields.mapValues { en -> en.value.text.toString().ifBlank { DEF_T.getValue(en.key) } }
                      st.save(t, ans.text.toString(), cmds.text.toString())
                      Toast.makeText(this, "Сохранено", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(bt("Сбросить всё") { st.reset(); recreate() })
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: AdminTools-debug, path: app/build/outputs/apk/debug/*.apk }
