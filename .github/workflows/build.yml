name: build
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/grandmobile/admintools app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AdminTools"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.grandmobile.admintools"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.grandmobile.admintools"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Намеренно без разрешения INTERNET: приложение ничего не отправляет наружу -->
              <application android:label="Админ-тулс" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AdminKeyboard"
                      android:label="Админ-клавиатура"
                      android:exported="true"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          cat > app/src/main/java/com/grandmobile/admintools/Data.kt <<'EOF'
          package com.grandmobile.admintools

          import android.content.Context

          class Act(val cmd: String, val a: Int = 0, val b: Int = 0) {
              fun times(): List<Int> = when {
                  a == 0 -> listOf(0)
                  a == b -> listOf(a)
                  else -> listOf(a, b)
              }
          }

          class Vio(val code: String, val note: String, val variants: List<List<Act>>)

          // строка: код|пояснение|вариант / вариант ; в варианте действия через «+» ; срок: N или A-B
          private val TABLE = """
          2.1 ОП|оск. игрока|mute 15-30
          2.1 ОП|упом. род|mute 90-180
          2.1 ОП|оск. род|ban 7
          3.1 ОП|оффтоп в реп|rmute 30
          3.2 ОП|оск. адм|mute 30-60 / ban 3-31
          2.5 ОП|шум в микро|mute 20
          2.5 ОП|музыка в микро|mute 30-60
          5.2 ОП|багаюз|warn
          5.2 ОП|софт|ban 31
          5.3 ОП|уход от рп|jail 120
          1.1 GZ|урон в зз|jail 60+warn
          1.2 GZ|веревка в зз|warn
          DM||jail 30-60
          DB||jail 30
          MG||mute 15
          RK||jail 30
          SK||jail 60-120
          PG||jail 30
          Mass DM||warn
          Mass DM в GZ||jail 90+warn
          """.trimIndent()

          object Data {
              val V: List<Vio> = TABLE.lines().map { l ->
                  val p = l.split("|")
                  Vio(p[0], p[1], p[2].split("/").map { v ->
                      v.split("+").map { a ->
                          val t = a.trim().split(" ")
                          val r = t.getOrNull(1)?.split("-")
                          val x = r?.get(0)?.toInt() ?: 0
                          Act(t[0], x, r?.getOrNull(1)?.toInt() ?: x)
                      }
                  })
              }
          }

          val DEF_T = linkedMapOf(
              "ans" to "/pm {id} {r}",
              "jail" to "/jail {id} {t} {r}",
              "ban" to "/ban {id} {t} {r}",
              "mute" to "/mute {id} {t} {r}",
              "rmute" to "/rmute {id} {t} {r}",
              "warn" to "/warn {id} {r}"
          )

          val DEF_BEGIN = """
          Приветствую, приятной игры на Grand Mobile 10 <3
          Приветствую, слежу за Вами.
          Приветствую, не владеем данной информацией.
          Приветствую, при следующем оффтопе последует мут репорта.
          Приветствую, при наличии доказательств подайте жалобу.
          Приветствую, не чиним, воспользуйтесь рем.комплектом/эвакуатором.
          Приветствую, уточните ваш вопрос или жалобу.
          Приветствую, слежу за игроком.
          Приветствую, не вмешиваемся в РП процесс.
          Приветствую, не чиним / не заправляем / не выдаем / не телепортируем.
          Приветствую, если не согласны с наказанием, напишите жалобу.
          Приветствую, рп термин.
          Приветствую, нашли баг? обратитесь в тех.поддержку.
          Приветствую, ожидайте.
          Приветствую, не предоставляем данную услугу.
          Приветствую, можете узнать самостоятельно.
          Приветствую, можете помочь себе сами — кнопка эвакуатора на спидометре.
          Приветствую, можете воспользоваться эвакуатором — кнопка на спидометре.
          Приветствую, нажмите кнопку эвакуатора на спидометре для помощи.
          Приветствую, чтобы перевернуть автомобиль, нажмите кнопку эвакуатора на спидометре.
          """.trimIndent()

          val DEF_END = """
          Приветствую, игрок был наказан, приятной игры!
          Приветствую, за спам и флуд в чате наказания не выдаем!
          Приветствую, администрация не является гарантом обмена.
          Приветствую, телепорт на мероприятие закрыт.
          Приветствую, игрок не нарушает.
          Приветствую, за время наблюдения нарушений не зафиксировано.
          Приветствую, помогли Вам. Приятной игры!<3
          Приветствую, чтобы починить автомобиль, нажмите кнопку эвакуатора на спидометре.
          Приветствую, чтобы выбраться из воды, нажмите кнопку эвакуатора на спидометре.
          Здравствуйте, Вы можете помочь себе самостоятельно, нажав кнопку эвакуатора на спидометре.
          """.trimIndent()

          val DEF_CMDS = """
          /az
          /gm
          /clist
          /sp {id}
          /spoff
          /spawn {id}
          /slap {id}
          /goto {id}
          /mark
          /gotomark
          /unban {id}
          /unjail {id}
          /unmute {id}
          /freeze {id}
          /unfreeze {id}
          /uncuff {id}
          /gotocar {id}
          /gethere {id}
          /hpall
          /weapall
          """.trimIndent()

          class Store(c: Context) {
              private val p = c.getSharedPreferences("s", Context.MODE_PRIVATE)
              fun templates(): Map<String, String> = DEF_T.mapValues { p.getString("t_" + it.key, it.value) ?: it.value }
              fun beginText(): String = p.getString("begin", DEF_BEGIN) ?: DEF_BEGIN
              fun endText(): String = p.getString("end", DEF_END) ?: DEF_END
              private fun clean(t: String): List<String> = t.lines().map { it.trim() }.filter { it.isNotEmpty() }
              fun begins(): List<String> = clean(beginText())
              fun ends(): List<String> = clean(endText())
              fun cmdsText(): String = p.getString("cmds", DEF_CMDS) ?: DEF_CMDS
              // строка команды: «/sp {id}» или «название|/sp {id}»; без названия на кнопке будет сама команда
              fun cmds(): List<Pair<String, String>> = cmdsText().lines().map { it.trim() }.filter { it.isNotEmpty() }.map { l ->
                  val i = l.indexOf('|')
                  if (i in 1 until l.length - 1) l.substring(0, i).trim() to l.substring(i + 1).trim()
                  else l.split(" ")[0] to l
              }
              fun count(): Int = p.getInt("cnt", 0)
              fun setCount(n: Int) { p.edit().putInt("cnt", n).apply() }
              fun save(t: Map<String, String>, b: String, n: String, c: String) {
                  val e = p.edit()
                  t.forEach { (k, v) -> e.putString("t_$k", v) }
                  e.putString("begin", b).putString("end", n).putString("cmds", c).apply()
              }
              fun reset() { val n = p.getInt("cnt", 0); p.edit().clear().putInt("cnt", n).apply() }
          }
          EOF
          cat > app/src/main/java/com/grandmobile/admintools/AdminKeyboard.kt <<'EOF'
          package com.grandmobile.admintools

          import android.content.res.ColorStateList
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputConnection
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          // тёплая палитра: эспрессо, крем, янтарь и терракота
          private val BG = 0xFF1C1512.toInt()
          private val SURF = 0xFF2E2420.toInt()
          private val FIELD = 0xFF241B17.toInt()
          private val LINE = 0xFF43352D.toInt()
          private val ACC = 0xFFF2A33A.toInt()
          private val SEND = 0xFFE8743B.toInt()
          private val TXT = 0xFFF6E9DA.toInt()
          private val DARK = 0xFF2A1A10.toInt()
          private val HINT = 0xFF8C7767.toInt()
          private val DANGER = 0xFF6E2B25.toInt()
          private val TINT = mapOf(
              "jail" to 0xFF5E4313.toInt(), "ban" to 0xFF6E2B25.toInt(),
              "mute" to 0xFF35503F.toInt(), "rmute" to 0xFF35503F.toInt(), "warn" to 0xFF5A3558.toInt()
          )

          class AdminKeyboard : InputMethodService() {
              private val st by lazy { Store(this) }
              private lateinit var main: LinearLayout
              private lateinit var lp: LinearLayout
              private lateinit var list: LinearLayout
              private lateinit var idTv: TextView
              private val tabs = ArrayList<Button>()
              private var compact = false
              private var tab = 0
              private var open = -1
              private val id = StringBuilder()
              private var tpl: Map<String, String> = DEF_T
              private var begins: List<String> = emptyList()
              private var ends: List<String> = emptyList()
              private var cmds: List<Pair<String, String>> = emptyList()
              private var count = 0
              private var pmFlag = false
              private var letters = false
              private var ru = true
              private var shift = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private val unit get() = if (compact) 35 else 42

              override fun onEvaluateFullscreenMode(): Boolean = false

              private fun bg(col: Int): RippleDrawable {
                  val g = when (col) {
                      ACC -> GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFFF5B342.toInt(), 0xFFEE8F3A.toInt()))
                      SEND -> GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFFEE7A45.toInt(), 0xFFD9553A.toInt()))
                      else -> GradientDrawable().apply { setColor(col); setStroke(dp(1), LINE) }
                  }
                  g.cornerRadius = dp(9).toFloat()
                  return RippleDrawable(ColorStateList.valueOf(0x33FFFFFF), g, null)
              }

              private fun btn(
                  t: String, col: Int = SURF, w: Float = 1f, size: Float = 15f, h: Int = 0,
                  left: Boolean = false, click: () -> Unit
              ): Button = Button(this).apply {
                  text = t; isAllCaps = false; textSize = size
                  setTextColor(if (col == ACC || col == SEND) DARK else TXT); background = bg(col)
                  stateListAnimator = null
                  minHeight = 0; minimumHeight = 0; minWidth = 0; minimumWidth = 0
                  if (h == -1) minimumHeight = dp(44)
                  setPadding(dp(4), if (h == -1) dp(6) else 0, dp(4), if (h == -1) dp(6) else 0)
                  gravity = if (left) Gravity.START or Gravity.CENTER_VERTICAL else Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(0, if (h == -1) ViewGroup.LayoutParams.WRAP_CONTENT else dp(if (h == 0) unit else h), w)
                      .apply { setMargins(dp(2), dp(1), dp(2), dp(1)) }
                  setOnClickListener { click() }
              }

              private fun hrow(vararg v: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  v.forEach { addView(it) }
              }

              // наказания и ответы: если ID не введён, подставляется слово ID
              private fun fmt(cmd: String, t: Int, r: String): String =
                  (tpl[cmd] ?: DEF_T.getValue(cmd))
                      .replace("{id}", if (id.isEmpty()) "ID" else id.toString())
                      .replace("{t}", if (t == 0) "" else t.toString())
                      .replace("{r}", r)
                      .replace(Regex("\\s+"), " ").trim()

              // команды: без ID вставляется «/sp » с пробелом, чтобы номер можно было дописать
              private fun fmtCmd(t: String): String {
                  var s = t.replace("{id}", id.toString()).replace("{t}", "").replace("{r}", "")
                      .replace(Regex("\\s+"), " ").trim()
                  if (t.contains("{id}") && id.isEmpty()) s += " "
                  return s
              }

              private fun commit(s: String) { currentInputConnection?.commitText(s, 1) }

              private fun deleteBack() {
                  val ic = currentInputConnection ?: return
                  ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL))
                  ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL))
              }

              // ---------- счётчик: считаются все сообщения, начинающиеся с /pm ----------
              private fun fieldText(ic: InputConnection): String =
                  (ic.getTextBeforeCursor(2000, 0)?.toString() ?: "") + (ic.getTextAfterCursor(2000, 0)?.toString() ?: "")

              private fun isPm(t: String): Boolean = t.trimStart().startsWith("/pm ", ignoreCase = true)

              private fun countOne() {
                  count += 1
                  st.setCount(count)
                  updateTabs()
              }

              // нажатие «Отправить» на сообщении с /pm считается сразу
              private fun sendEnter() {
                  val ic = currentInputConnection ?: return
                  val wasPm = isPm(fieldText(ic))
                  // false: выполнить действие поля, даже если оно помечено «Enter = новая строка»
                  if (!sendDefaultEditorAction(false)) {
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
                  if (wasPm) { pmFlag = false; countOne() }
              }

              // если /pm-сообщение исчезло из поля целиком (отправили кнопкой самой игры), тоже считаем
              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  val ic = currentInputConnection ?: return
                  val txt = fieldText(ic)
                  if (txt.isEmpty()) {
                      if (pmFlag) { pmFlag = false; countOne() }
                  } else {
                      pmFlag = isPm(txt)
                  }
              }

              // стирает всё, что написано в поле ввода (не только вставленное клавиатурой)
              private fun clearAll() {
                  val ic = currentInputConnection ?: return
                  pmFlag = false
                  ic.beginBatchEdit()
                  ic.performContextMenuAction(android.R.id.selectAll)
                  ic.commitText("", 1)
                  ic.deleteSurroundingText(10000, 10000)
                  ic.endBatchEdit()
              }

              private fun reload() { tpl = st.templates(); begins = st.begins(); ends = st.ends(); cmds = st.cmds(); count = st.count() }

              private fun updateTabs() {
                  if (tabs.size > 1) tabs[1].text = "Ответы  " + count
              }

              private fun switchSystemKeyboard() {
                  val ok = if (Build.VERSION.SDK_INT >= 28) switchToPreviousInputMethod() else false
                  if (!ok) (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
              }

              override fun onCreateInputView(): View {
                  reload()
                  compact = resources.configuration.screenHeightDp < 480
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                  }
                  main = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  lp = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  tabs.clear()
                  listOf("Наказания", "Ответы", "Команды").forEachIndexed { i, n ->
                      tabs.add(btn(n, size = 14f) { setTab(i) })
                  }
                  // долгое нажатие на «Ответы» обнуляет счётчик
                  tabs[1].setOnLongClickListener {
                      count = 0; st.setCount(0); updateTabs()
                      Toast.makeText(this, "Счётчик сброшен", Toast.LENGTH_SHORT).show()
                      true
                  }
                  updateTabs()
                  // «ABC» открывает буквенную раскладку прямо внутри этой клавиатуры
                  val abc = btn("ABC", w = 0.6f, size = 14f) { letters = true; applyMode() }
                  val send = btn("Отправить", SEND, w = 1.3f, size = 14f) { sendEnter() }
                  val erase = btn("Стереть", DANGER, w = 1.1f, size = 14f) { clearAll() }
                  idTv = TextView(this).apply {
                      setTextColor(TXT); textSize = if (compact) 17f else 19f; typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), 0, dp(12), 0)
                      background = GradientDrawable().apply { setColor(FIELD); setStroke(dp(1), LINE); cornerRadius = dp(9).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(0, dp(unit), if (compact) 1.4f else 1.6f)
                          .apply { setMargins(dp(2), dp(1), dp(2), dp(1)) }
                  }
                  val back = btn("⌫", w = 0.6f) { if (id.isNotEmpty()) id.deleteCharAt(id.length - 1); idChanged() }
                  val clear = btn("C", w = 0.6f) { id.setLength(0); idChanged() }

                  if (compact) {
                      main.addView(hrow(*tabs.toTypedArray(), idTv, back, clear, abc, erase, send))
                  } else {
                      main.addView(hrow(*tabs.toTypedArray(), abc))
                      main.addView(hrow(idTv, back, clear, erase, send))
                  }
                  main.addView(hrow(*"1234567890".map { c ->
                      btn(c.toString(), h = unit - 2) { if (id.length < 7) id.append(c); idChanged() }
                  }.toTypedArray()))

                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val sv = ScrollView(this).apply { addView(list) }
                  main.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(if (compact) 104 else 150)))

                  root.addView(main)
                  root.addView(lp)
                  idChanged()
                  setTab(tab)
                  applyMode()
                  return root
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  pmFlag = false
                  if (::list.isInitialized) { reload(); updateTabs(); renderList() }
              }

              private fun applyMode() {
                  main.visibility = if (letters) View.GONE else View.VISIBLE
                  lp.visibility = if (letters) View.VISIBLE else View.GONE
                  if (letters) renderLetters()
              }

              // ---------- буквенная раскладка ----------
              private fun typeText(s: String) { currentInputConnection?.commitText(s, 1) }

              private fun key(c: Char): Button {
                  val s = if (shift) c.uppercaseChar().toString() else c.toString()
                  return btn(s, size = 18f) {
                      typeText(s)
                      if (shift) { shift = false; renderLetters() }
                  }
              }

              private fun renderLetters() {
                  lp.removeAllViews()
                  val rows = if (ru) listOf("йцукенгшщзхъ", "фывапролджэ", "ячсмитьбюё")
                  else listOf("qwertyuiop", "asdfghjkl", "zxcvbnm")
                  lp.addView(hrow(*"1234567890".map { c -> btn(c.toString()) { typeText(c.toString()) } }.toTypedArray()))
                  lp.addView(hrow(*rows[0].map { key(it) }.toTypedArray()))
                  lp.addView(hrow(*rows[1].map { key(it) }.toTypedArray()))
                  lp.addView(hrow(
                      btn("⇧", if (shift) ACC else SURF, w = 1.3f, size = 18f) { shift = !shift; renderLetters() },
                      *rows[2].map { key(it) }.toTypedArray(),
                      btn("⌫", w = 1.3f) { deleteBack() }
                  ))
                  lp.addView(hrow(
                      btn("Панель", w = 1.5f, size = 14f) { letters = false; applyMode() },
                      btn("🌐", w = 0.9f, size = 14f) { switchSystemKeyboard() },
                      btn(if (ru) "RU" else "EN", w = 0.9f, size = 14f) { ru = !ru; renderLetters() },
                      btn("/", w = 0.9f, size = 18f) { typeText("/") },
                      btn("пробел", w = 2.4f, size = 14f) { typeText(" ") },
                      btn(".", w = 0.8f, size = 18f) { typeText(".") },
                      btn(",", w = 0.8f, size = 18f) { typeText(",") },
                      btn("Отправить", SEND, w = 1.6f, size = 14f) { sendEnter() }
                  ))
              }

              // ---------- основная панель ----------
              private fun idChanged() {
                  idTv.text = if (id.isEmpty()) "ID" else id.toString()
                  idTv.setTextColor(if (id.isEmpty()) HINT else TXT)
                  if (::list.isInitialized) renderList()
              }

              private fun setTab(t: Int) {
                  tab = t; open = -1
                  tabs.forEachIndexed { i, b ->
                      b.background = bg(if (i == t) ACC else SURF)
                      b.setTextColor(if (i == t) DARK else TXT)
                  }
                  renderList()
              }

              private fun renderList() {
                  list.removeAllViews()
                  when (tab) {
                      0 -> violations()
                      1 -> answers()
                      else -> commands()
                  }
              }

              private fun violations() {
                  Data.V.forEachIndexed { i, v ->
                      val label = v.code + (if (v.note.isBlank()) "" else "  ·  " + v.note)
                      list.addView(hrow(btn(label, if (open == i) ACC else SURF, left = true) {
                          open = if (open == i) -1 else i
                          renderList()
                      }))
                      if (open == i) {
                          v.variants.forEach { acts ->
                              acts.forEach { a ->
                                  a.times().forEach { t ->
                                      val c = fmt(a.cmd, t, v.code)
                                      list.addView(hrow(btn(c, TINT[a.cmd] ?: SURF, size = 16f, left = true) { commit(c) }))
                                  }
                              }
                          }
                      }
                  }
              }

              // два столбца готовых фраз: «Начало» и «Конец» обслуживания репорта
              private fun column(title: String, items: List<String>): LinearLayout {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  col.addView(TextView(this).apply {
                      text = title; setTextColor(HINT); textSize = 12f
                      setPadding(dp(6), dp(2), 0, dp(2))
                  })
                  items.forEach { t ->
                      col.addView(hrow(btn(t, SURF, size = 14f, h = -1, left = true) { commit(fmt("ans", 0, t)) }))
                  }
                  return col
              }

              private fun answers() {
                  list.addView(hrow(column("Начало", begins), column("Конец", ends)))
              }

              private fun commands() {
                  val cols = if (compact) 8 else 4
                  cmds.chunked(cols).forEach { row ->
                      val v = ArrayList<View>()
                      row.forEach { (name, c) -> v.add(btn(name, size = 14f) { commit(fmtCmd(c)) }) }
                      repeat(cols - row.size) {
                          v.add(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, dp(unit), 1f) })
                      }
                      list.addView(hrow(*v.toTypedArray()))
                  }
              }
          }
